[project]
name = "brain"
version = "0.1.0"
description = "Local-first personal knowledge OS: an Obsidian Markdown vault as canonical store, with a Knowledge API as the invariant-preserving write path."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["ruamel.yaml>=0.18"]

[project.scripts]
brain = "brain.cli:main"

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brain"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "ruamel.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
